<title>Diagnóstico Digital COMEEN</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap');

/* ===== src/styles/tokens.css ===== */
/* ============================================================================
   styles/tokens.css - Design tokens COMEEN
   ----------------------------------------------------------------------------
   Marca tomada del sistema de "Come en Girardota" (src/styles/_tokens.scss):
   violeta corporativo, naranja de acento, Poppins + Manrope.

   TEMA CLARO COMPROMETIDO. La aplicacion se ve igual en cualquier dispositivo,
   tenga o no modo oscuro el sistema: fondos claros siempre. Por eso no hay
   bloques @media (prefers-color-scheme) ni [data-theme]; en cambio cada color
   -incluido el fondo del body- se pinta explicitamente, para que la pagina no
   herede el fondo del entorno donde se abra.

   Los neutros no son grises puros: llevan un sesgo hacia el violeta de marca,
   que es lo que los hace verse elegidos y no heredados.

   La rampa de graficos esta verificada con el validador de paleta sobre el
   fondo real (#f7f5fb): pasos monotonos, separacion suficiente, un solo tono.
   ========================================================================== */

:root {
  color-scheme: light;

  /* -- Violeta corporativo --------------------------------------------- */
  --violet-50:  #f1eefc;
  --violet-100: #e4defa;
  --violet-200: #cdc2f6;
  --violet-300: #a48fe8;
  --violet-400: #8b6fe0;
  --violet-500: #7662ec;
  --violet-600: #5e49d6;
  --violet-700: #3d2bbf;
  --violet-800: #2d1fa0;
  --violet-900: #1e1480;

  /* -- Naranja de acento (vivo) ---------------------------------------- */
  --orange-50:  #fff4ec;
  --orange-100: #ffe6d5;
  --orange-200: #ffcaa6;
  --orange-400: #ff9a3d;
  --orange-500: #ff6a14;
  --orange-600: #f4590a;
  --orange-700: #d64a06;

  /* -- Neutros con sesgo violeta --------------------------------------- */
  --neutral-0:   #ffffff;
  --neutral-50:  #faf9fd;
  --neutral-100: #f4f2fa;
  --neutral-200: #e7e3f2;
  --neutral-300: #d6d0e6;
  --neutral-400: #b3abcb;
  --neutral-500: #948caf;
  --neutral-600: #6f688c;
  --neutral-700: #565073;
  --neutral-800: #322d47;
  --neutral-900: #1a1626;

  /* -- Roles de marca --------------------------------------------------- */
  --brand:          var(--violet-600);
  --brand-rgb:      94, 73, 214;
  --brand-light:    var(--violet-500);
  --brand-dark:     var(--violet-700);
  --brand-border:   var(--violet-200);
  --brand-surface:  var(--violet-50);
  --brand-on:       #ffffff;
  --acento:         var(--orange-500);
  --acento-rgb:     255, 106, 20;
  --acento-surface: var(--orange-50);
  --gradiente-marca:  linear-gradient(135deg, var(--violet-600) 0%, var(--violet-500) 100%);
  --gradiente-calido: linear-gradient(135deg, #ff5f0a 0%, #ff9a3d 100%);

  /* Cabecera del resultado: la unica banda de color pleno de la aplicacion.
     Violeta de marca, no un fondo oscuro generico. */
  --hero: linear-gradient(140deg, #3d2bbf 0%, #5e49d6 46%, #8b6fe0 100%);
  --hero-brillo: radial-gradient(circle, rgba(255, 154, 61, .38) 0%, transparent 70%);

  /* -- Superficies y texto ---------------------------------------------- */
  --fondo:        #f7f5fb;
  --superficie:   #ffffff;
  --superficie-2: #faf9fd;
  --superficie-3: #f1eef8;
  --texto:        #1a1626;
  --texto-2:      #565073;
  --texto-3:      #857ea0;
  --borde:        #e7e3f2;
  --borde-fuerte: #d6d0e6;

  /* -- Estados de nivel --------------------------------------------------
     Paleta de estado: siempre acompanada del numero y el nombre del nivel,
     nunca del color a solas. */
  --nivel-1:         #d03b3b;
  --nivel-1-surface: #fdeced;
  --nivel-1-texto:   #9b2020;
  --nivel-2:         #f2a20c;
  --nivel-2-surface: #fef4e0;
  --nivel-2-texto:   #8a5300;
  --nivel-3:         #0ca30c;
  --nivel-3-surface: #e6f7e6;
  --nivel-3-texto:   #0a6b0a;

  /* -- Semanticos -------------------------------------------------------- */
  --bien:     #0ca30c;
  --aviso:    #a35c00;
  --critico:  #c0261f;
  --info:     #2563eb;
  --whatsapp: #25d366;

  /* -- Rampa ordinal para graficos (violeta, claro -> oscuro) ------------ */
  --serie-1: #a48fe8;
  --serie-2: #7662ec;
  --serie-3: #5e49d6;
  --serie-4: #3d2bbf;
  --serie-5: #1e1480;
  --grafico-eje:  #857ea0;
  --grafico-reja: #e7e3f2;

  /* -- Tipografia -------------------------------------------------------- */
  --font-titulo: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  --font-cuerpo: 'Manrope', 'Segoe UI', system-ui, sans-serif;

  --texto-xs:   0.75rem;
  --texto-sm:   0.875rem;
  --texto-base: 1rem;
  --texto-md:   1.125rem;
  --texto-lg:   1.25rem;
  --texto-xl:   1.5rem;
  --texto-2xl:  2rem;
  --texto-3xl:  2.5rem;

  /* -- Espaciado, bordes, sombras, movimiento --------------------------- */
  --e-1: 0.25rem; --e-2: 0.5rem;  --e-3: 0.75rem; --e-4: 1rem;
  --e-5: 1.25rem; --e-6: 1.5rem;  --e-8: 2rem;    --e-10: 2.5rem; --e-12: 3rem;

  --radio-xs: 4px;  --radio-sm: 8px;  --radio-md: 12px;
  --radio-lg: 16px; --radio-xl: 20px; --radio-full: 9999px;

  /* Sombras tenidas de violeta: sobre fondo claro un gris neutro se ve sucio. */
  --sombra-xs: 0 1px 2px rgba(26, 22, 38, .05);
  --sombra-sm: 0 2px 8px rgba(45, 31, 160, .07);
  --sombra-md: 0 6px 20px rgba(45, 31, 160, .10);
  --sombra-lg: 0 14px 40px rgba(45, 31, 160, .16);
  --sombra-marca: 0 6px 18px rgba(var(--brand-rgb), .30);

  --dur-rapida: 150ms;
  --dur-normal: 200ms;
  --dur-lenta:  300ms;
  --curva: cubic-bezier(0.4, 0, 0.2, 1);
}

@media (prefers-reduced-motion: reduce) {
  :root { --dur-rapida: 0ms; --dur-normal: 0ms; --dur-lenta: 0ms; }
}


/* ===== src/styles/app.css ===== */
/* ============================================================================
   styles/app.css — Interfaz COMEEN
   Mobile-first. Botones grandes, una idea por pantalla, lenguaje directo.
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font-cuerpo);
  background: var(--fondo);
  color: var(--texto);
  font-size: var(--texto-base);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* ── Hexágonos dispersos ──────────────────────────────────────────────────
   La composición vive en ui/fondo.js, no aquí: como imagen de fondo no se
   podría animar el contorno de cada hexágono por separado.

   Dos movimientos, los dos deliberadamente lentos. La capa entera describe un
   círculo de 20 px cada cuatro minutos —no se percibe mirando, se percibe al
   volver a mirar— y un reflejo recorre el perímetro de cada hexágono en quince
   segundos.

   La capa se dibuja más grande que la ventana para que la órbita nunca deje
   ver un borde. No recibe clics y se apaga entera con prefers-reduced-motion. */
.fondo-panal {
  position: fixed;
  inset: -6%;
  z-index: 0;
  pointer-events: none;
  animation: panal-orbita 240s linear infinite;
  will-change: transform;
}

/* Ocho pasos en vez de cuatro: con cuatro el recorrido se lee como un rombo. */
@keyframes panal-orbita {
  0%     { transform: translate(0, -20px); }
  12.5%  { transform: translate(14px, -14px); }
  25%    { transform: translate(20px, 0); }
  37.5%  { transform: translate(14px, 14px); }
  50%    { transform: translate(0, 20px); }
  62.5%  { transform: translate(-14px, 14px); }
  75%    { transform: translate(-20px, 0); }
  87.5%  { transform: translate(-14px, -14px); }
  100%   { transform: translate(0, -20px); }
}

/* El destello es un tramo corto del contorno que se desplaza por él. El
   perímetro está normalizado a 1000 unidades con pathLength, así que un mismo
   recorrido sirve para hexágonos de cualquier tamaño. */
.fondo-panal__brillo {
  stroke-opacity: 0;
  animation: panal-reflejo 15s linear infinite;
}

@keyframes panal-reflejo {
  0%   { stroke-dashoffset: 0;     stroke-opacity: 0; }
  6%   {                           stroke-opacity: .38; }
  60%  {                           stroke-opacity: .38; }
  70%  { stroke-dashoffset: -1000; stroke-opacity: 0; }
  100% { stroke-dashoffset: -1000; stroke-opacity: 0; }
}

/* Halo violeta muy tenue en el borde superior. */
body::after {
  content: '';
  position: fixed;
  inset: 0 0 auto 0;
  height: 340px;
  z-index: 0;
  pointer-events: none;
  background: radial-gradient(120% 100% at 50% 0%, rgba(94, 73, 214, .09) 0%, rgba(94, 73, 214, 0) 70%);
}

/* El contenido va por encima de las capas decorativas. */
#app { position: relative; z-index: 1; }

/* La cabecera de resultado conserva su propio panal como imagen de fondo: es
   una banda pequeña y estática, no necesita animarse. */

@media (prefers-reduced-motion: reduce) {
  .fondo-panal { animation: none; }
  .fondo-panal__brillo { animation: none; display: none; }
}

/* ── Barra superior: la píldora de cristal del directorio ───────────────── */
.barra {
  position: sticky;
  top: 0;
  z-index: 50;
  padding: var(--e-2) var(--e-3) 0;
}

.barra__vidrio {
  display: flex;
  align-items: center;
  gap: var(--e-3);
  padding: var(--e-3) var(--e-4);
  border-radius: var(--radio-xl);
  background: rgba(var(--brand-rgb), 0.90);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  border: 1px solid rgba(255, 255, 255, 0.20);
  box-shadow: 0 10px 30px rgba(28, 10, 0, .28), 0 2px 8px rgba(var(--brand-rgb), .28);
}

.barra__marca {
  display: flex;
  align-items: center;
  gap: var(--e-2);
  font-family: var(--font-titulo);
  font-weight: 800;
  color: #fff;
  font-size: 1.05rem;
  letter-spacing: 0.2px;
  white-space: nowrap;
}

.barra__sello {
  display: grid;
  place-items: center;
  width: 30px; height: 30px;
  border-radius: 9px;
  background: var(--gradiente-calido);
  font-size: 0.95rem;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .25);
}

.barra__sufijo {
  font-weight: 500;
  font-size: var(--texto-xs);
  color: rgba(255, 255, 255, .78);
  border-left: 1px solid rgba(255, 255, 255, .30);
  padding-left: var(--e-2);
  white-space: nowrap;
}

.barra__acciones { margin-left: auto; display: flex; gap: var(--e-2); }

.barra__btn {
  background: rgba(255, 255, 255, .15);
  border: 1px solid rgba(255, 255, 255, .22);
  color: #fff;
  font-family: var(--font-titulo);
  font-weight: 600;
  font-size: var(--texto-sm);
  padding: 0.4rem 0.9rem;
  border-radius: var(--radio-full);
  cursor: pointer;
  transition: background var(--dur-rapida) var(--curva);
  white-space: nowrap;
}
.barra__btn:hover { background: rgba(255, 255, 255, .28); }
.barra__btn[aria-current="page"] { background: #fff; color: var(--brand-dark); border-color: #fff; }

/* ── Contenedores ───────────────────────────────────────────────────────── */
.capa { padding: var(--e-5) var(--e-4) var(--e-12); }
.capa--angosta { max-width: 620px;  margin: 0 auto; }  /* cuestionario */
.capa--media   { max-width: 940px;  margin: 0 auto; }  /* resultado */
.capa--ancha   { max-width: 1180px; margin: 0 auto; }  /* panel y ficha */

/* ── Botones ────────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--e-2);
  padding: 0.8rem 1.35rem;
  border-radius: var(--radio-md);
  border: 1px solid transparent;
  font-family: var(--font-titulo);
  font-weight: 700;
  font-size: var(--texto-base);
  cursor: pointer;
  text-decoration: none;
  transition: transform var(--dur-rapida) var(--curva), box-shadow var(--dur-rapida) var(--curva), opacity var(--dur-rapida);
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:not(:disabled):active { transform: translateY(1px); }

.btn--principal {
  background: var(--gradiente-marca);
  color: var(--brand-on);
  box-shadow: var(--sombra-marca);
}
.btn--principal:not(:disabled):hover { box-shadow: 0 6px 20px rgba(var(--brand-rgb), .38); }

.btn--calido { background: var(--gradiente-calido); color: #fff; box-shadow: 0 4px 14px rgba(var(--acento-rgb), .32); }

.btn--secundario {
  background: var(--superficie);
  color: var(--texto);
  border-color: var(--borde-fuerte);
}
.btn--secundario:not(:disabled):hover { border-color: var(--brand); color: var(--brand); }

.btn--peligro {
  background: var(--critico);
  color: #ffffff;
  box-shadow: 0 4px 14px rgba(192, 38, 31, .28);
}
.btn--peligro:not(:disabled):hover { box-shadow: 0 6px 20px rgba(192, 38, 31, .38); }

.btn--fantasma { background: transparent; color: var(--texto-2); border-color: transparent; }
.btn--fantasma:hover { color: var(--brand); }

.btn--bloque { width: 100%; }
.btn--pequeno { padding: 0.45rem 0.85rem; font-size: var(--texto-sm); border-radius: var(--radio-sm); }

/* ── Progreso del cuestionario ──────────────────────────────────────────── */
.progreso { margin-bottom: var(--e-5); }

.progreso__cabecera {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--e-3);
  margin-bottom: var(--e-2);
}

.progreso__etapa {
  font-family: var(--font-titulo);
  font-size: var(--texto-xs);
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--brand);
}

.progreso__conteo {
  font-size: var(--texto-xs);
  color: var(--texto-3);
  font-variant-numeric: tabular-nums;
}

.progreso__riel {
  height: 6px;
  border-radius: var(--radio-full);
  background: var(--borde);
  overflow: hidden;
}

/* El violeta estructura y el naranja marca el avance: son los dos colores de
   la marca, cada uno con un trabajo distinto. */
.progreso__avance {
  height: 100%;
  border-radius: var(--radio-full);
  background: var(--gradiente-calido);
  transition: width var(--dur-lenta) var(--curva);
}

/* ── Bloque de paso ─────────────────────────────────────────────────────── */
.paso__titulo {
  font-size: var(--texto-xl);
  font-weight: 700;
  margin-bottom: var(--e-2);
  padding-top: var(--e-3);
  border-top: 3px solid var(--acento);
  display: inline-block;
}
.paso__intro  { color: var(--texto-2); margin: 0 0 var(--e-6); max-width: 60ch; }

.grupo { display: flex; flex-direction: column; gap: var(--e-5); }

/* ── Pregunta con opciones grandes ──────────────────────────────────────── */
.pregunta {
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--radio-lg);
  padding: var(--e-5);
  box-shadow: var(--sombra-xs);
}

.pregunta__dimension {
  font-family: var(--font-titulo);
  font-size: var(--texto-xs);
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--acento);
  display: block;
  margin-bottom: var(--e-2);
}

.pregunta__texto {
  font-family: var(--font-titulo);
  font-weight: 600;
  font-size: var(--texto-md);
  margin: 0 0 var(--e-4);
  text-wrap: balance;
}

.opciones { display: flex; flex-direction: column; gap: var(--e-2); }

.opcion {
  display: flex;
  align-items: center;
  gap: var(--e-3);
  width: 100%;
  text-align: left;
  padding: 0.85rem 1rem;
  border-radius: var(--radio-md);
  border: 1.5px solid var(--borde-fuerte);
  background: var(--superficie-2);
  cursor: pointer;
  transition: border-color var(--dur-rapida), background var(--dur-rapida);
  font-size: var(--texto-base);
  line-height: 1.35;
}
.opcion:hover { border-color: var(--brand-light); }

.opcion__marca {
  flex: 0 0 auto;
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 2px solid var(--borde-fuerte);
  display: grid;
  place-items: center;
  transition: border-color var(--dur-rapida), background var(--dur-rapida);
}
.opcion__marca::after {
  content: '';
  width: 10px; height: 10px;
  border-radius: 50%;
  background: transparent;
  transition: background var(--dur-rapida);
}

.opcion[aria-pressed="true"] {
  border-color: var(--brand);
  background: var(--brand-surface);
  font-weight: 600;
}
.opcion[aria-pressed="true"] .opcion__marca { border-color: var(--brand); }
.opcion[aria-pressed="true"] .opcion__marca::after { background: var(--brand); }

/* ── Campos de formulario ───────────────────────────────────────────────── */
.campo { display: flex; flex-direction: column; gap: var(--e-2); }

.campo__etiqueta {
  font-family: var(--font-titulo);
  font-weight: 600;
  font-size: var(--texto-sm);
}
.campo__ayuda { font-size: var(--texto-xs); color: var(--texto-3); }
.campo__error { font-size: var(--texto-xs); color: var(--critico); font-weight: 600; }

.campo__control {
  width: 100%;
  padding: 0.75rem 0.9rem;
  border-radius: var(--radio-md);
  border: 1.5px solid var(--borde-fuerte);
  background: var(--superficie);
  color: var(--texto);
  transition: border-color var(--dur-rapida), box-shadow var(--dur-rapida);
}
.campo__control:focus {
  outline: none;
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(var(--brand-rgb), .14);
}
.campo__control--error { border-color: var(--critico); }
textarea.campo__control { resize: vertical; min-height: 88px; }

.requerido { color: var(--acento); }

/* Campo que aparece al elegir "otro": colgado del campo que lo abrió. */
.campo--anidado {
  margin-top: calc(-1 * var(--e-2));
  padding-left: var(--e-4);
  border-left: 2px solid var(--brand-border);
}

/* ── Matriz de canales ──────────────────────────────────────────────────── */
.matriz { display: flex; flex-direction: column; gap: var(--e-3); }

.matriz__fila {
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--radio-lg);
  padding: var(--e-4);
  box-shadow: var(--sombra-xs);
}

.matriz__canal {
  font-family: var(--font-titulo);
  font-weight: 700;
  font-size: var(--texto-base);
  margin-bottom: var(--e-3);
  display: flex;
  align-items: center;
  gap: var(--e-2);
}

.matriz__opciones { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--e-2); }

.matriz__btn {
  padding: 0.6rem 0.4rem;
  border-radius: var(--radio-sm);
  border: 1.5px solid var(--borde-fuerte);
  background: var(--superficie-2);
  font-size: var(--texto-xs);
  font-weight: 600;
  line-height: 1.25;
  cursor: pointer;
  transition: border-color var(--dur-rapida), background var(--dur-rapida), color var(--dur-rapida);
}
.matriz__btn:hover { border-color: var(--brand-light); }
.matriz__btn[aria-pressed="true"] { border-color: var(--brand); background: var(--brand); color: var(--brand-on); }

/* ── Selección de prioridades (fichas numeradas) ────────────────────────── */
.fichas { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: var(--e-2); }

.ficha-opcion {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--e-2);
  padding: 0.7rem 0.85rem;
  border-radius: var(--radio-md);
  border: 1.5px solid var(--borde-fuerte);
  background: var(--superficie);
  cursor: pointer;
  text-align: left;
  font-size: var(--texto-sm);
  font-weight: 600;
  transition: border-color var(--dur-rapida), background var(--dur-rapida);
}
.ficha-opcion:hover:not(:disabled) { border-color: var(--brand-light); }
.ficha-opcion:disabled { opacity: .40; cursor: not-allowed; }
.ficha-opcion[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-surface); }

.ficha-opcion__orden {
  position: absolute;
  top: -8px; right: -8px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--gradiente-marca);
  color: var(--brand-on);
  display: grid;
  place-items: center;
  font-family: var(--font-titulo);
  font-size: var(--texto-xs);
  font-weight: 800;
  box-shadow: var(--sombra-sm);
}

/* ── Navegación inferior fija ───────────────────────────────────────────── */
.pie-nav {
  position: sticky;
  bottom: 0;
  display: flex;
  gap: var(--e-3);
  padding: var(--e-3) var(--e-4);
  margin: var(--e-6) calc(-1 * var(--e-4)) calc(-1 * var(--e-12));
  background: color-mix(in srgb, var(--fondo) 88%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--borde);
}
.pie-nav .btn--principal { flex: 1; }

.aviso-validacion {
  font-size: var(--texto-sm);
  color: var(--critico);
  font-weight: 600;
  margin: 0 0 var(--e-3);
}

/* ── Insignia de nivel ──────────────────────────────────────────────────── */
.insignia {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  padding: 0.35rem 0.85rem;
  border-radius: var(--radio-full);
  font-family: var(--font-titulo);
  font-size: var(--texto-xs);
  font-weight: 700;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.insignia__punto { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }

.insignia--nivel-1 { background: var(--nivel-1-surface); color: var(--nivel-1-texto); }
.insignia--nivel-1 .insignia__punto { background: var(--nivel-1); }
.insignia--nivel-2 { background: var(--nivel-2-surface); color: var(--nivel-2-texto); }
.insignia--nivel-2 .insignia__punto { background: var(--nivel-2); }
.insignia--nivel-3 { background: var(--nivel-3-surface); color: var(--nivel-3-texto); }
.insignia--nivel-3 .insignia__punto { background: var(--nivel-3); }

.insignia--neutro { background: var(--superficie-3); color: var(--texto-2); }
.insignia--neutro .insignia__punto { background: var(--texto-3); }
.insignia--info   { background: var(--brand-surface); color: var(--brand-dark); }
.insignia--info .insignia__punto { background: var(--brand); }
.insignia--aviso  { background: var(--nivel-2-surface); color: var(--nivel-2-texto); }
.insignia--aviso .insignia__punto { background: var(--nivel-2); }
.insignia--bien   { background: var(--nivel-3-surface); color: var(--nivel-3-texto); }
.insignia--bien .insignia__punto { background: var(--nivel-3); }

/* ── Ficha de resultado ─────────────────────────────────────────────────── */
.resultado { display: flex; flex-direction: column; gap: var(--e-5); }

/* La cabecera lleva su propia composición de hexágonos, en blanco y naranja
   claro sobre el violeta de marca. Aquí sí como imagen de fondo: es una banda
   pequeña, estática, y no necesita animarse. */
.resultado__cabecera {
  border-radius: var(--radio-xl);
  padding: var(--e-6);
  color: #fff;
  box-shadow: var(--sombra-lg);
  position: relative;
  overflow: hidden;
  background-image: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22900%22 height=%22440%22 viewBox=%220 0 900 440%22 preserveAspectRatio=%22xMidYMid slice%22%3E%3Cpath d=%22M973.0 41.3L930.3 172.6L795.4 201.2L703.0 98.7L745.7 -32.6L880.6 -61.2Z%22 fill=%22%23ffffff%22 fill-opacity=%220.050%22/%3E%3Cpath d=%22M973.0 41.3L930.3 172.6L795.4 201.2L703.0 98.7L745.7 -32.6L880.6 -61.2Z%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-opacity=%220.15%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M845.8 401.8L768.1 476.8L664.3 447.0L638.2 342.2L715.9 267.2L819.7 297.0Z%22 fill=%22none%22 stroke=%22%23ff9a3d%22 stroke-opacity=%220.32%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M986.2 300.8L912.7 362.5L822.5 329.7L805.8 235.2L879.3 173.5L969.5 206.3Z%22 fill=%22none%22 stroke=%22%23ff9a3d%22 stroke-opacity=%220.24%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M734.8 434.7L688.3 549.7L565.5 567.0L489.2 469.3L535.7 354.3L658.5 337.0Z%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-opacity=%220.11%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M142.2 52.1L67.7 141.0L-46.6 120.9L-86.2 11.9L-11.7 -77.0L102.6 -56.9Z%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-opacity=%220.13%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M176.7 404.8L156.4 486.4L75.7 509.5L15.3 451.2L35.6 369.6L116.3 346.5Z%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-opacity=%220.12%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E"), var(--hero);
  background-size: cover, auto;
  background-repeat: no-repeat, no-repeat;
  background-position: center, center;
}

@media (max-width: 760px) {
  .resultado__cabecera {
    background-image: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22420%22 height=%22560%22 viewBox=%220 0 420 560%22 preserveAspectRatio=%22xMidYMid slice%22%3E%3Cpath d=%22M507.4 67.5L471.0 179.7L355.5 204.2L276.6 116.5L313.0 4.3L428.5 -20.2Z%22 fill=%22%23ffffff%22 fill-opacity=%220.045%22/%3E%3Cpath d=%22M507.4 67.5L471.0 179.7L355.5 204.2L276.6 116.5L313.0 4.3L428.5 -20.2Z%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-opacity=%220.15%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M456.0 448.7L381.2 520.9L281.2 492.2L256.0 391.3L330.8 319.1L430.8 347.8Z%22 fill=%22none%22 stroke=%22%23ff9a3d%22 stroke-opacity=%220.30%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M504.8 315.4L438.9 370.7L358.1 341.3L343.2 256.6L409.1 201.3L489.9 230.7Z%22 fill=%22none%22 stroke=%22%23ff9a3d%22 stroke-opacity=%220.22%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M122.9 496.4L81.0 600.3L-30.0 615.8L-98.9 527.6L-57.0 423.7L54.0 408.2Z%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-opacity=%220.11%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M74.6 52.0L15.5 122.5L-75.1 106.5L-106.6 20.0L-47.5 -50.5L43.1 -34.5Z%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-opacity=%220.12%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E"), var(--hero);
  }
}
.resultado__cabecera::after {
  content: '';
  position: absolute;
  inset: auto -30% -60% auto;
  width: 260px; height: 260px;
  border-radius: 50%;
  background: var(--hero-brillo);
  pointer-events: none;
}

.resultado__eyebrow {
  font-family: var(--font-titulo);
  font-size: var(--texto-xs);
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, .72);
}

.resultado__negocio {
  font-size: var(--texto-2xl);
  font-weight: 800;
  margin: var(--e-2) 0 var(--e-4);
  color: #fff;
}

.resultado__nivel {
  display: inline-flex;
  align-items: center;
  gap: var(--e-2);
  padding: 0.5rem 1rem;
  border-radius: var(--radio-full);
  background: rgba(255, 255, 255, .12);
  border: 1px solid rgba(255, 255, 255, .24);
  font-family: var(--font-titulo);
  font-weight: 700;
  font-size: var(--texto-base);
  color: #fff;
}
.resultado__nivel .insignia__punto { width: 10px; height: 10px; }

.resultado__mensaje {
  margin: var(--e-4) 0 0;
  color: rgba(255, 255, 255, .88);
  max-width: 54ch;
  position: relative;
  z-index: 1;
}

/* Medidor de puntaje */
.medidor { margin-top: var(--e-5); position: relative; z-index: 1; }

.medidor__cifra {
  font-family: var(--font-titulo);
  font-size: var(--texto-2xl);
  font-weight: 800;
  color: #fff;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.medidor__cifra span { font-size: var(--texto-md); font-weight: 600; color: rgba(255, 255, 255, .62); }

.medidor__riel {
  margin-top: var(--e-3);
  height: 10px;
  border-radius: var(--radio-full);
  background: rgba(255, 255, 255, .16);
  overflow: hidden;
}
.medidor__avance { height: 100%; border-radius: var(--radio-full); background: var(--gradiente-calido); }

.medidor__cortes {
  display: flex;
  justify-content: space-between;
  margin-top: var(--e-2);
  font-size: var(--texto-xs);
  color: rgba(255, 255, 255, .60);
  font-variant-numeric: tabular-nums;
}

/* Tarjetas de sección */
.tarjeta {
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--radio-lg);
  padding: var(--e-5);
  box-shadow: var(--sombra-xs);
}

.tarjeta__titulo {
  font-family: var(--font-titulo);
  font-size: var(--texto-xs);
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--texto-3);
  margin-bottom: var(--e-4);
}

.dos-columnas { display: grid; gap: var(--e-4); }
@media (min-width: 680px) { .dos-columnas { grid-template-columns: 1fr 1fr; } }

/* Listas de fortalezas / oportunidades */
.lista-marcas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--e-2); }

.lista-marcas li {
  display: flex;
  align-items: flex-start;
  gap: var(--e-2);
  font-size: var(--texto-sm);
  line-height: 1.45;
}

.marca-si, .marca-falta, .marca-parcial {
  flex: 0 0 auto;
  width: 18px; height: 18px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 800;
  margin-top: 2px;
}
.marca-si      { background: var(--nivel-3-surface); color: var(--nivel-3-texto); }
.marca-falta   { background: var(--nivel-1-surface); color: var(--nivel-1-texto); }
.marca-parcial { background: var(--nivel-2-surface); color: var(--nivel-2-texto); }

/* Ruta de servicios recomendados */
.ruta { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--e-3); }

.ruta__paso {
  display: flex;
  gap: var(--e-3);
  align-items: flex-start;
  padding: var(--e-3);
  border-radius: var(--radio-md);
  background: var(--superficie-2);
  border: 1px solid var(--borde);
}

.ruta__orden {
  flex: 0 0 auto;
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--gradiente-marca);
  color: var(--brand-on);
  display: grid;
  place-items: center;
  font-family: var(--font-titulo);
  font-weight: 800;
  font-size: var(--texto-sm);
}

.ruta__nombre { font-family: var(--font-titulo); font-weight: 700; display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
.ruta__desc   { font-size: var(--texto-sm); color: var(--texto-2); margin-top: 2px; }

.etiqueta-origen {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 0.12rem 0.45rem;
  border-radius: var(--radio-xs);
  background: var(--superficie-3);
  color: var(--texto-3);
  white-space: nowrap;
}
.etiqueta-origen--ambas { background: var(--brand-surface); color: var(--brand-dark); }
.etiqueta-origen--pedida { background: var(--acento-surface); color: var(--orange-700); }

.plegable > summary {
  cursor: pointer;
  font-family: var(--font-titulo);
  font-weight: 600;
  font-size: var(--texto-sm);
  color: var(--brand);
  padding: var(--e-2) 0;
  list-style: none;
}
.plegable > summary::-webkit-details-marker { display: none; }
.plegable > summary::before { content: '▸ '; }
.plegable[open] > summary::before { content: '▾ '; }

/* Fila de canales en el resultado */
.canales-fila { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: var(--e-2); }

.canal-pastilla {
  border: 1px solid var(--borde);
  border-radius: var(--radio-md);
  padding: var(--e-3);
  background: var(--superficie-2);
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}
.canal-pastilla__nombre { font-family: var(--font-titulo); font-weight: 700; font-size: var(--texto-sm); }
.canal-pastilla__estado { font-size: var(--texto-xs); font-weight: 600; }
.canal-pastilla--bien    .canal-pastilla__estado { color: var(--bien); }
.canal-pastilla--aviso   .canal-pastilla__estado { color: var(--aviso); }
.canal-pastilla--critico .canal-pastilla__estado { color: var(--critico); }
.canal-pastilla--neutro  .canal-pastilla__estado { color: var(--texto-3); }

.nota-coherencia {
  border-left: 3px solid var(--nivel-2);
  background: var(--nivel-2-surface);
  color: var(--nivel-2-texto);
  padding: var(--e-3) var(--e-4);
  border-radius: 0 var(--radio-sm) var(--radio-sm) 0;
  font-size: var(--texto-sm);
}

/* ── Ingreso del administrador ──────────────────────────────────────────── */
.ingreso { display: flex; flex-direction: column; gap: var(--e-5); }
.ingreso .btn--bloque { margin-top: var(--e-2); }

/* ── Panel: indicadores ─────────────────────────────────────────────────── */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--e-3); }

.kpi {
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--radio-lg);
  padding: var(--e-4);
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
}
.kpi__valor {
  font-family: var(--font-titulo);
  font-size: var(--texto-2xl);
  font-weight: 800;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.kpi__etiqueta { font-size: var(--texto-xs); color: var(--texto-2); }
.kpi--n1 .kpi__valor { color: var(--nivel-1); }
.kpi--n2 .kpi__valor { color: var(--nivel-2-texto); }
.kpi--n3 .kpi__valor { color: var(--nivel-3); }

.rejilla-paneles { display: grid; gap: var(--e-4); }
@media (min-width: 860px) { .rejilla-paneles { grid-template-columns: 1fr 1fr; } }

/* ── Gráficos de barras ─────────────────────────────────────────────────── */
.grafico { display: flex; flex-direction: column; gap: var(--e-3); }

.barra-dato { display: grid; grid-template-columns: minmax(96px, 34%) 1fr auto; align-items: center; gap: var(--e-3); }

.barra-dato__etiqueta {
  font-size: var(--texto-sm);
  color: var(--texto-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.barra-dato__pista { height: 22px; background: var(--superficie-3); border-radius: var(--radio-xs); overflow: hidden; }

.barra-dato__relleno {
  height: 100%;
  border-radius: 0 4px 4px 0;
  background: var(--serie-3);
  min-width: 3px;
  transition: width var(--dur-lenta) var(--curva);
}

.barra-dato__valor {
  font-size: var(--texto-sm);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--texto);
  min-width: 2.5ch;
  text-align: right;
}

.leyenda { display: flex; flex-wrap: wrap; gap: var(--e-3); margin-top: var(--e-3); font-size: var(--texto-xs); color: var(--texto-2); }
.leyenda__item { display: inline-flex; align-items: center; gap: 0.4rem; }
.leyenda__muestra { width: 12px; height: 12px; border-radius: 3px; }

.pie-grafico { font-size: var(--texto-xs); color: var(--texto-3); margin-top: var(--e-3); }

/* ── Filtros y tabla ────────────────────────────────────────────────────── */
.filtros { display: flex; flex-wrap: wrap; gap: var(--e-2); align-items: center; }
.filtros .campo__control { width: auto; min-width: 150px; padding: 0.5rem 0.7rem; font-size: var(--texto-sm); }
.filtros__buscador { flex: 1 1 200px; }

.tabla-envoltura { overflow-x: auto; border: 1px solid var(--borde); border-radius: var(--radio-lg); background: var(--superficie); }

.tabla { width: 100%; border-collapse: collapse; font-size: var(--texto-sm); min-width: 680px; }
.tabla th {
  text-align: left;
  font-family: var(--font-titulo);
  font-size: var(--texto-xs);
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--texto-3);
  padding: var(--e-3) var(--e-4);
  border-bottom: 1px solid var(--borde);
  background: var(--superficie-2);
  white-space: nowrap;
}
.tabla td { padding: var(--e-3) var(--e-4); border-bottom: 1px solid var(--borde); vertical-align: middle; }
.tabla tr:last-child td { border-bottom: none; }
.tabla tbody tr { cursor: pointer; transition: background var(--dur-rapida); }
.tabla tbody tr:hover { background: var(--superficie-2); }
.tabla__num { font-variant-numeric: tabular-nums; font-weight: 700; }
.tabla__negocio { font-family: var(--font-titulo); font-weight: 700; }
.tabla__sub { font-size: var(--texto-xs); color: var(--texto-3); }
.tabla__servicios { font-size: var(--texto-xs); color: var(--texto-2); }

/* ── Aviso de cuestionario a medias ─────────────────────────────────────── */
.aviso-borrador {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--e-3);
  padding: var(--e-4);
  border-radius: var(--radio-lg);
  background: var(--acento-surface);
  border: 1px solid var(--orange-200);
  border-left: 4px solid var(--acento);
}
.aviso-borrador__texto { flex: 1 1 260px; font-size: var(--texto-sm); color: var(--orange-700); }
.aviso-borrador__texto strong { font-family: var(--font-titulo); }

/* ── Estado vacío ───────────────────────────────────────────────────────── */
.vacio {
  text-align: center;
  padding: var(--e-10) var(--e-4);
  border: 1.5px dashed var(--borde-fuerte);
  border-radius: var(--radio-lg);
  color: var(--texto-2);
}
.vacio__titulo { font-family: var(--font-titulo); font-weight: 700; font-size: var(--texto-md); margin-bottom: var(--e-2); color: var(--texto); }

/* ── Encabezado de sección ──────────────────────────────────────────────── */
.seccion { display: flex; flex-direction: column; gap: var(--e-4); margin-bottom: var(--e-8); }

.seccion__cabecera { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--e-3); flex-wrap: wrap; }
.seccion__titulo {
  font-size: var(--texto-lg);
  font-weight: 700;
  padding-top: var(--e-3);
  border-top: 3px solid var(--acento);
}
.seccion__nota { font-size: var(--texto-sm); color: var(--texto-2); margin: 0; max-width: 62ch; }

/* ── Ficha individual ───────────────────────────────────────────────────── */
/* Diagnóstico a la izquierda, datos y gestión a la derecha. En pantallas
   angostas cae a una sola columna y conserva ese orden de lectura. */
.ficha { display: grid; gap: var(--e-5); align-items: start; }

@media (min-width: 1000px) {
  .ficha { grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); }
  .ficha__lateral { position: sticky; top: 84px; }
}

.ficha__principal, .ficha__lateral { display: flex; flex-direction: column; gap: var(--e-5); min-width: 0; }

.datos-lista { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--e-4); }
.dato__etiqueta { font-size: var(--texto-xs); color: var(--texto-3); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
.dato__valor { font-size: var(--texto-sm); margin-top: 2px; word-break: break-word; }

.acciones-fila { display: flex; flex-wrap: wrap; gap: var(--e-2); }

.aviso-modo {
  display: flex;
  align-items: center;
  gap: var(--e-2);
  font-size: var(--texto-xs);
  color: var(--texto-2);
  background: var(--superficie-2);
  border: 1px solid var(--borde);
  border-radius: var(--radio-full);
  padding: 0.3rem 0.8rem;
  width: fit-content;
}
.aviso-modo__punto { width: 7px; height: 7px; border-radius: 50%; background: var(--bien); }
.aviso-modo--local .aviso-modo__punto { background: var(--acento); }

.mensaje-flotante {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  z-index: 200;
  background: var(--texto);
  color: var(--fondo);
  padding: 0.7rem 1.2rem;
  border-radius: var(--radio-full);
  font-size: var(--texto-sm);
  font-weight: 600;
  box-shadow: var(--sombra-lg);
  max-width: calc(100vw - 32px);
  text-align: center;
}

@media (min-width: 720px) {
  .capa { padding: var(--e-8) var(--e-6) var(--e-12); }
  .paso__titulo { font-size: var(--texto-2xl); }
  .resultado__negocio { font-size: var(--texto-3xl); }
  .matriz__fila { display: grid; grid-template-columns: 200px 1fr; align-items: center; gap: var(--e-4); }

    return fetch(config().url + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': config().anonKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: refresco })

      body: JSON.stringify({ email: email, password: clave })

      return r.text().then(function (texto) {
        var datos = texto ? JSON.parse(texto) : null;

/* ===== src/core/almacenamiento.js ===== */
/* ============================================================================
   core/almacenamiento.js — Capa de datos
   ----------------------------------------------------------------------------
   Tres adaptadores tras una misma interfaz. El resto de la aplicación no sabe
   cuál está activo.

     supabase   → base de datos real. Es el modo de producción.
                  Sin sesión solo puede insertar (así lo permite el RLS);
                  con sesión de administrador, leer, editar y borrar.
     compartido → base del artefacto publicado, para uso interno.
     local      → localStorage. Sin servidor y sin conexión.

   COLA DE PENDIENTES. En la calle la señal se cae. Si una inserción falla, el
   diagnóstico no se pierde: queda en el dispositivo y se reintenta solo. Por
   eso 'guardar' nunca le dice al encuestador que perdió su trabajo.
   ========================================================================== */
(function (global) {
  'use strict';

  var CLAVE_LOCAL = 'comeen.diagnosticos.v2';
  var CLAVE_BORRADOR = 'comeen.borrador.v2';
  var CLAVE_PENDIENTES = 'comeen.pendientes.v2';
  var COLECCION = 'negocios';

  /* ── localStorage tolerante a fallo ─────────────────────────────────────── */
  function leerLocal(clave, porDefecto) {
    try {
      var crudo = global.localStorage.getItem(clave);
      return crudo ? JSON.parse(crudo) : porDefecto;
    } catch (e) { return porDefecto; }
  }
  function escribirLocal(clave, valor) {
    try { global.localStorage.setItem(clave, JSON.stringify(valor)); return true; }
    catch (e) { return false; }
  }

  /* ── Traducción entre el registro de la app y la fila de la tabla ───────── */
  /* Las columnas derivadas existen para filtrar y graficar en SQL sin abrir el
     json. La verdad completa vive en 'datos': cuando el instrumento cambie, el
     json absorbe la nueva forma sin migrar la tabla. */
  function aFila(registro) {
    var d = global.COMEEN.diagnostico.evaluar(registro);
    var n = registro.negocio || {};
    return {
      id: registro.id,
      creado: registro.creado,
      actualizado: registro.actualizado,
      version_instrumento: registro.versionInstrumento,
      origen: registro.origen || 'publico',
      negocio_nombre: n.nombre || 'Sin nombre',
      categoria: global.COMEEN.diagnostico.textoCampo(n, 'categoria'),
      municipio: n.municipio || null,
      barrio: n.barrio || null,
      nivel: d.nivel.id,
      puntaje: d.puntaje,
      pago: registro.pago || null,
      estado: registro.estado || 'pendiente',
      datos: registro
    };
  }

  function deFila(fila) {
    var r = fila.datos || {};
    /* Las columnas que el panel edita mandan sobre lo que traiga el json:
       si se cambió el estado por SQL, esa es la verdad. */
    r.id = fila.id;
    r.estado = fila.estado || r.estado || 'pendiente';
    r.origen = fila.origen || r.origen || 'publico';
    r.creado = fila.creado || r.creado;
    r.actualizado = fila.actualizado || r.actualizado;
    return r;
  }

  /* ── Cola de pendientes ─────────────────────────────────────────────────── */
  function pendientes() { return leerLocal(CLAVE_PENDIENTES, []); }

  function encolar(registro) {
    var cola = pendientes().filter(function (r) { return r.id !== registro.id; });
    cola.push(registro);
    escribirLocal(CLAVE_PENDIENTES, cola);
  }

  function desencolar(id) {
    escribirLocal(CLAVE_PENDIENTES, pendientes().filter(function (r) { return r.id !== id; }));
  }

  /* Reintenta la cola. Se llama al arrancar y cuando vuelve la conexión. */
  function sincronizar() {
    var cola = pendientes();
    if (!cola.length) return Promise.resolve(0);
    var enviados = 0;
    return cola.reduce(function (previa, registro) {
      return previa.then(function () {
        return global.COMEEN.supabase.insertar(aFila(registro))
          .then(function () { desencolar(registro.id); enviados++; })
          .catch(function () { /* sigue pendiente; se reintenta después */ });
      });
    }, Promise.resolve()).then(function () { return enviados; });
  }

  /* ── Adaptador local ────────────────────────────────────────────────────── */
  function adaptadorLocal() {
    var oyentes = [];
    function todos() { return leerLocal(CLAVE_LOCAL, []); }
    function avisar() { var lista = todos(); oyentes.forEach(function (f) { f(lista); }); }

    return {
      modo: 'local',
      etiqueta: 'Este dispositivo',
      puedeLeer: true,
      listar: function () { return Promise.resolve(todos()); },
      obtener: function (id) {
        return Promise.resolve(todos().filter(function (x) { return x.id === id; })[0] || null);
      },
      guardar: function (registro) {
        var lista = todos();
        var i = -1;
        for (var k = 0; k < lista.length; k++) if (lista[k].id === registro.id) i = k;
        registro.actualizado = new Date().toISOString();
        if (i >= 0) lista[i] = registro; else lista.unshift(registro);
        var ok = escribirLocal(CLAVE_LOCAL, lista);

                  : Promise.reject(new Error('No se pudo guardar en este dispositivo. Puede que el almacenamiento esté lleno o bloqueado.'));

      eliminar: function (id) {
        escribirLocal(CLAVE_LOCAL, todos().filter(function (x) { return x.id !== id; }));
        avisar();
        return Promise.resolve();
      },
      suscribir: function (fn) {
        oyentes.push(fn);
        fn(todos());
        return function () { oyentes = oyentes.filter(function (f) { return f !== fn; }); };
      }
    };
  }

  /* ── Adaptador Supabase ─────────────────────────────────────────────────── */
  function adaptadorSupabase() {
    var S = global.COMEEN.supabase;

    return {
      modo: 'supabase',
      etiqueta: 'Base de datos COMEEN',
      /* Sin sesión el RLS no permite leer: el panel exige ingresar. */
      get puedeLeer() { return S.haySesion(); },

      listar: function () {
        if (!S.haySesion()) return Promise.resolve([]);
        return S.listar().then(function (filas) { return (filas || []).map(deFila); });
      },

      obtener: function (id) {
        if (!S.haySesion()) return Promise.resolve(null);
        return S.obtener(id).then(function (fila) { return fila ? deFila(fila) : null; });
      },

      guardar: function (registro) {
        registro.actualizado = new Date().toISOString();
        var fila = aFila(registro);

        if (S.haySesion()) {
          /* El administrador edita filas existentes: PATCH y, si no existía
             todavía, se crea. */
          return S.actualizar(registro.id, fila)
            .then(function () { return registro; })
            .catch(function (e) {
              if (e.estado === 404 || e.estado === 406) return S.insertar(fila).then(function () { return registro; });
              throw e;
            });
        }

        /* Encuesta pública: insertar y nada más. Si falla, queda en cola —
           nunca se le dice al encuestador que perdió el diagnóstico. */
        return S.insertar(fila)
          .then(function () { desencolar(registro.id); return registro; })
          .catch(function () {
            encolar(registro);
            return registro;
          });
      },

      eliminar: function (id) { return S.eliminar(id); },

      /* Sin websockets: el panel refresca cada 45 segundos. Para el volumen de
         un municipio es de sobra, y evita mantener una conexión abierta en un
         celular en la calle. */
      suscribir: function (fn) {
        var vivo = true;
        var self = this;
        function tic() {
          if (!vivo) return;
          self.listar().then(function (lista) { if (vivo) fn(lista); }).catch(function () {});
        }
        tic();
        var reloj = setInterval(tic, 45000);
        return function () { vivo = false; clearInterval(reloj); };
      }
    };
  }

  /* ── Adaptador del artefacto publicado ──────────────────────────────────── */
  function adaptadorCompartido(db) {
    return {
      modo: 'compartido',
      etiqueta: 'Base compartida COMEEN',
      puedeLeer: true,
      listar: function () {
        return db.collection(COLECCION).get().then(function (snap) {
          return snap.docs.map(function (d) { return d.data(); })
            .sort(function (a, b) { return (b.actualizado || '').localeCompare(a.actualizado || ''); });
        });
      },
      obtener: function (id) {
        return db.doc(COLECCION + '/' + id).get().then(function (s) { return s.exists ? s.data() : null; });
      },
      guardar: function (registro) {
        registro.actualizado = new Date().toISOString();
        return db.doc(COLECCION + '/' + registro.id).set(registro).then(function () { return registro; });
      },
      eliminar: function (id) { return db.doc(COLECCION + '/' + id).delete(); },
      suscribir: function (fn) {
        return db.collection(COLECCION).onSnapshot(function (snap) {
          fn(snap.docs.map(function (d) { return d.data(); })
            .sort(function (a, b) { return (b.actualizado || '').localeCompare(a.actualizado || ''); }));
        }, function () { /* la interfaz sigue mostrando lo último recibido */ });
      }
    };
  }

  /* Elige el adaptador disponible, en orden de preferencia. Nunca falla: si no
     hay base de datos, el trabajo de campo continúa en el dispositivo. */
  function iniciar() {
    if (global.COMEEN.configSupabase && global.COMEEN.configSupabase.configurado) {
      var sb = adaptadorSupabase();
      /* Reintenta en silencio lo que quedó pendiente de una jornada anterior. */
      sincronizar().catch(function () {});
      global.addEventListener('online', function () { sincronizar().catch(function () {}); });
      return Promise.resolve(sb);
    }

    var local = adaptadorLocal();
    if (!global.claude || typeof global.claude.use !== 'function') return Promise.resolve(local);

    return global.claude.use('db')
      .then(function (db) { return db ? adaptadorCompartido(db) : local; })
      .catch(function () { return local; });
  }

  /* ── Borrador en curso (siempre local: es progreso, no dato definitivo) ── */
  var borrador = {
    leer: function () { return leerLocal(CLAVE_BORRADOR, null); },
    escribir: function (estado) { return escribirLocal(CLAVE_BORRADOR, estado); },
    limpiar: function () { try { global.localStorage.removeItem(CLAVE_BORRADOR); } catch (e) {} }
  };

  global.COMEEN = global.COMEEN || {};
  global.COMEEN.almacenamiento = {
    iniciar: iniciar,
    borrador: borrador,
    sincronizar: sincronizar,
    pendientes: pendientes,
    aFila: aFila,
    deFila: deFila,
    CLAVE_LOCAL: CLAVE_LOCAL
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* ============================================================================
   core/exportacion.js — Exportación a CSV y Excel
   ----------------------------------------------------------------------------
   Una fila por negocio. Las columnas se declaran una sola vez y sirven para
   ambos formatos, así el CSV y el Excel nunca se desincronizan.

(function (global) {
  'use strict';

  function columnas() {
    var I = global.COMEEN.instrumento;
    var cols = [
      { titulo: 'ID',          valor: function (r) { return r.id; } },
      { titulo: 'NEGOCIO',     valor: function (r) { return r.negocio.nombre; } },
      { titulo: 'PROPIETARIO', valor: function (r) { return r.negocio.propietario; } },
      { titulo: 'CATEGORIA',   valor: function (r) { return global.COMEEN.diagnostico.textoCampo(r.negocio, 'categoria'); } },
      { titulo: 'CATEGORIA_LISTA', valor: function (r) { return r.negocio.categoria; } },
      { titulo: 'TELEFONO',    valor: function (r) { return r.negocio.telefono; } },
      { titulo: 'WHATSAPP',    valor: function (r) { return r.negocio.whatsapp; } },
      { titulo: 'MUNICIPIO',   valor: function (r) { return r.negocio.municipio; } },
      { titulo: 'BARRIO',      valor: function (r) { return r.negocio.barrio; } },
      { titulo: 'NIVEL',       valor: function (r, d) { return d.nivel.id; } },
      { titulo: 'NIVEL_NOMBRE', valor: function (r, d) { return d.nivel.nivel.nombre; } },
      { titulo: 'PUNTAJE',     valor: function (r, d) { return d.puntaje; } },
      { titulo: 'PORCENTAJE',  valor: function (r, d) { return d.porcentaje; } },
      { titulo: 'DESCENDIDO_POR_COHERENCIA', valor: function (r, d) { return d.nivel.descendido ? 'Sí' : 'No'; } }
    ];

    /* Las 12 variables de madurez, en crudo, para reanalizar en Excel. */
    I.QUESTIONS.forEach(function (q) {
      cols.push({ titulo: q.id + '_' + q.variable.toUpperCase().replace(/ /g, '_'),
                  valor: function (r) { var v = r.madurez[q.id]; return v === undefined ? '' : v; } });
    });

    /* Estado de cada canal. */
    I.CHANNELS.forEach(function (c) {
      cols.push({ titulo: 'CANAL_' + c.id.toUpperCase(),
                  valor: function (r) { var v = r.canales[c.id]; return v === undefined ? '' : v; } });
    });

    /* Brechas percibidas. */
    I.GAPS.forEach(function (g) {
      cols.push({ titulo: g.id + '_' + g.necesidad.toUpperCase().replace(/ /g, '_'),
                  valor: function (r) { return r.brechas[g.id] || ''; } });
    });

    cols.push(
      { titulo: 'SERVICIOS_RECOMENDADOS', valor: function (r, d) { return d.codigosServicio.join(' | '); } },
      { titulo: 'SERVICIOS_DIAGNOSTICADOS_Y_PEDIDOS', valor: function (r, d) { return d.cruce.ambas.join(' | '); } },
      { titulo: 'SERVICIOS_SOLO_DIAGNOSTICADOS',      valor: function (r, d) { return d.cruce.diagnostico.join(' | '); } },
      { titulo: 'SERVICIOS_SOLO_PEDIDOS',             valor: function (r, d) { return d.cruce.percibida.join(' | '); } },
      { titulo: 'PRIORIDAD_1', valor: function (r, d) { return d.prioridades[0] ? d.prioridades[0].texto : ''; } },
      { titulo: 'PRIORIDAD_2', valor: function (r, d) { return d.prioridades[1] ? d.prioridades[1].texto : ''; } },
      { titulo: 'PRIORIDAD_3', valor: function (r, d) { return d.prioridades[2] ? d.prioridades[2].texto : ''; } },
      { titulo: 'DISPOSICION_PAGO_CODIGO', valor: function (r) { return r.pago || ''; } },
      { titulo: 'DISPOSICION_PAGO',        valor: function (r, d) { return d.pago ? d.pago.texto : ''; } },
      { titulo: 'EN_DIRECTORIO_COMEEN',    valor: function (r) { return r.negocio.enComeen || ''; } },
      { titulo: 'ESTADO_ATENCION', valor: function (r) {
          var e = global.COMEEN.instrumento.ATTENTION_STATUSES.filter(function (x) { return x.id === r.estado; })[0];
          return e ? e.texto : r.estado; } },
      { titulo: 'NOTAS',   valor: function (r) { return r.notas || ''; } },
      { titulo: 'VERSION_INSTRUMENTO', valor: function (r) { return r.versionInstrumento || ''; } },
      { titulo: 'FECHA_DIAGNOSTICO',   valor: function (r) { return (r.creado || '').slice(0, 10); } },
      { titulo: 'ULTIMA_ACTUALIZACION', valor: function (r) { return (r.actualizado || '').slice(0, 10); } }
    );

    return cols;
  }

  function filas(registros) {
    var cols = columnas();
    return registros.map(function (r) {
      var d = global.COMEEN.diagnostico.evaluar(r);

  function aCSV(registros) {

  function aExcel(registros) {

      'th{background:#5E49D6;color:#fff;font-weight:700;text-align:left;padding:6px 10px;border:1px solid #3D2BBF}' +
      'td{padding:5px 10px;border:1px solid #DDD4C8;mso-number-format:"\\@"}</style>' +
      '<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>' +
      '<x:Name>Diagnosticos COMEEN</x:Name><x:WorksheetOptions><x:FreezePanes/>' +
      '<x:SplitHorizontal>1</x:SplitHorizontal><x:TopRowBottomPane>1</x:TopRowBottomPane>' +
      '<x:ActivePane>2</x:ActivePane></x:WorksheetOptions>' +
      '</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->' +
      '</head><body><table><thead><tr>' + cabecera + '</tr></thead><tbody>' + cuerpo + '</tbody></table></body></html>';

  }

    var I = global.COMEEN.instrumento;
    var pantallas = [{ tipo: 'intro', bloque: 'Bienvenida', preguntas: 0 }];

    pantallas.push({ tipo: 'datos', bloque: 'Su negocio', preguntas: 0,
      titulo: 'Cuéntenos de su negocio',
      intro: 'Con estos datos podemos identificarlo y volver a contactarlo.' });

    for (var i = 0; i < I.QUESTIONS.length; i += 2) {
      pantallas.push({
        tipo: 'madurez',
        bloque: 'Su negocio en Internet',
        items: I.QUESTIONS.slice(i, i + 2),
        preguntas: I.QUESTIONS.slice(i, i + 2).length,
        titulo: i === 0 ? 'Cómo se ve hoy su negocio' : null
      });
    }

    pantallas.push({ tipo: 'canales', bloque: 'Sus canales', preguntas: 1,
      titulo: '¿Dónde está su negocio hoy?',
      intro: 'Marque cómo está cada uno. Si lo tiene pero no lo usa hace meses, es "inactivo".' });

    pantallas.push({ tipo: 'brechas', bloque: 'Lo que necesita', items: I.GAPS.slice(0, 4), preguntas: 4,
      titulo: 'En qué le gustaría que le ayudáramos',
      intro: 'No hay respuestas correctas. Marque lo que de verdad le interesa.' });
    pantallas.push({ tipo: 'brechas', bloque: 'Lo que necesita', items: I.GAPS.slice(4), preguntas: 4 });

    pantallas.push({ tipo: 'prioridades', bloque: 'Sus prioridades', preguntas: 1,
      titulo: 'Si pudiera mejorar solo tres cosas',
      intro: 'Elija hasta tres, en el orden que las quiere. Ese orden nos dice por dónde empezar.' });

    pantallas.push({ tipo: 'pago', bloque: 'Para cerrar', preguntas: 1,
      titulo: 'Una última pregunta',
      intro: 'Nos ayuda a armar paquetes de servicio que sí estén al alcance de los negocios del municipio.' });

    return pantallas;
  }

  function crear(contenedor, opciones) {
    var I = global.COMEEN.instrumento;
    var pantallas = construirPantallas();
    var registro = opciones.registro;
    var indice = opciones.indiceInicial || 0;
    var errores = [];

    var totalPreguntas = pantallas.reduce(function (a, p) { return a + (p.preguntas || 0); }, 0);

    function preguntasAntesDe(i) {
      var n = 0;
      for (var k = 0; k < i; k++) n += pantallas[k].preguntas || 0;
      return n;
    }

    function guardarBorrador() {
      global.COMEEN.almacenamiento.borrador.escribir({ registro: registro, indice: indice });
    }

    /* ── Piezas ───────────────────────────────────────────────────────────── */

    function bloquePregunta(item, valorActual, alElegir, opcionesLista, dimension) {
      var opciones = el('div.opciones', { role: 'group', 'aria-label': item.pregunta });
      opcionesLista.forEach(function (op) {
        var elegida = String(valorActual) === String(op.valor);
        opciones.appendChild(el('button.opcion', {
          type: 'button',
          'aria-pressed': elegida ? 'true' : 'false',
          onclick: function () { alElegir(op.valor); }
        }, [el('span.opcion__marca'), el('span', { texto: op.texto })]));
      });

      return el('div.pregunta', null, [
        dimension ? el('span.pregunta__dimension', { texto: dimension }) : null,
        el('p.pregunta__texto', { texto: item.pregunta }),
        opciones
      ]);
    }

    function pantallaIntro() {
      return el('div', null, [
        el('div.resultado__cabecera', null, [
          el('p.resultado__eyebrow', { texto: 'Diagnóstico digital COMEEN' }),
          el('h1.resultado__negocio', { texto: 'Conozcamos su negocio' }),
          el('p.resultado__mensaje', {
            texto: 'Son unas preguntas cortas sobre cómo se ve hoy su negocio en Internet. ' +
                   'Al terminar le mostramos en qué está bien, qué le falta y cómo podemos ayudarle. ' +
                   'Toma entre 3 y 5 minutos.'
          })
        ]),
        el('div.tarjeta', { style: 'margin-top:var(--e-5)' }, [
          el('p.tarjeta__titulo', { texto: 'Qué vamos a mirar' }),
          el('ul.lista-marcas', null, [
            el('li', null, [el('span.marca-si', { texto: '1' }), 'Cómo se presenta su negocio: imagen, fotos y lo que ofrece']),
            el('li', null, [el('span.marca-si', { texto: '2' }), 'Por dónde lo contactan y dónde lo encuentran sus clientes']),
            el('li', null, [el('span.marca-si', { texto: '3' }), 'Qué le gustaría mejorar y con qué contamos para lograrlo'])
          ])
        ])
      ]);
    }

    function pantallaDatos() {
      var caja = el('div.grupo');
      I.CAMPOS_NEGOCIO.forEach(function (campo) {
        var valor = registro.negocio[campo.id] || '';
        var conError = errores.indexOf(campo.id) >= 0;
        var control;

        if (campo.tipo === 'seleccion') {
          control = el('select.campo__control' + (conError ? '.campo__control--error' : ''), {
            id: 'campo-' + campo.id,
            onchange: function (ev) { registro.negocio[campo.id] = ev.target.value; guardarBorrador(); }
          });
          control.appendChild(el('option', { value: '', texto: 'Seleccione…' }));
          campo.opciones.forEach(function (o) {
            var op = el('option', { value: o, texto: o });
            if (o === valor) op.selected = true;
            control.appendChild(op);
          });
        } else {
          var etiquetaHtml = campo.tipo === 'parrafo' ? 'textarea' : 'input';
          control = el(etiquetaHtml + '.campo__control' + (conError ? '.campo__control--error' : ''), {
            id: 'campo-' + campo.id,
            type: campo.tipo === 'tel' ? 'tel' : 'text',
            inputmode: campo.tipo === 'tel' ? 'tel' : null,
            valor: valor,
            oninput: function (ev) { registro.negocio[campo.id] = ev.target.value; guardarBorrador(); }
          });
        }

        caja.appendChild(el('div.campo', null, [
          el('label.campo__etiqueta', { for: 'campo-' + campo.id }, [
            campo.etiqueta,
            campo.requerido ? el('span.requerido', { texto: ' *' }) : null
          ]),
          campo.ayuda ? el('span.campo__ayuda', { texto: campo.ayuda }) : null,
          control,
          conError ? el('span.campo__error', { texto: 'Este dato es necesario para poder contactarlo.' }) : null

        /* Al elegir la opción "otro" se abre un campo para escribir cuál. */
        if (campo.otro && valor === campo.otro.cuando) {
          var errorOtro = errores.indexOf(campo.otro.id) >= 0;
          caja.appendChild(el('div.campo.campo--anidado', null, [
            el('label.campo__etiqueta', { for: 'campo-' + campo.otro.id }, [
              campo.otro.etiqueta,
              campo.otro.requerido ? el('span.requerido', { texto: ' *' }) : null
            ]),
            el('input.campo__control' + (errorOtro ? '.campo__control--error' : ''), {
              id: 'campo-' + campo.otro.id,
              type: 'text',
              autocomplete: 'off',
              valor: registro.negocio[campo.otro.id] || '',
              oninput: function (ev) { registro.negocio[campo.otro.id] = ev.target.value; guardarBorrador(); }
            }),
            errorOtro ? el('span.campo__error', { texto: 'Escriba a qué se dedica el negocio.' }) : null
          ]));
        }
      });
      return caja;
    }

    function pantallaMadurez(pantalla) {
      var caja = el('div.grupo');
      pantalla.items.forEach(function (q) {
        caja.appendChild(bloquePregunta(q, registro.madurez[q.id], function (v) {
          registro.madurez[q.id] = v;
          guardarBorrador();
          pintar();
        }, q.opciones, q.dimension));
      });
      return caja;
    }

    function pantallaCanales() {
      var caja = el('div.matriz');
      I.CHANNELS.forEach(function (canal) {
        var opciones = el('div.matriz__opciones', { role: 'group', 'aria-label': canal.nombre });
        I.CHANNEL_STATES.forEach(function (estado) {
          var elegida = String(registro.canales[canal.id]) === String(estado.valor);
          opciones.appendChild(el('button.matriz__btn', {
            type: 'button',
            'aria-pressed': elegida ? 'true' : 'false',
            onclick: function () { registro.canales[canal.id] = estado.valor; guardarBorrador(); pintar(); }
          }, estado.corto));
        });
        caja.appendChild(el('div.matriz__fila', null, [
          el('div.matriz__canal', null, canal.nombre),
          opciones
        ]));
      });
      return caja;
    }

    function pantallaBrechas(pantalla) {
      var caja = el('div.grupo');
      pantalla.items.forEach(function (g) {
        caja.appendChild(bloquePregunta(g, registro.brechas[g.id], function (v) {
          registro.brechas[g.id] = v;
          guardarBorrador();
          pintar();
        }, I.GAP_ANSWERS, g.necesidad));
      });
      return caja;
    }

    function pantallaPrioridades() {
      var elegidas = registro.prioridades;
      var lleno = elegidas.length >= I.PRIORITIES_MAX;
      var fichas = el('div.fichas');

      I.PRIORITIES.forEach(function (p) {
        var pos = elegidas.indexOf(p.id);
        var activa = pos >= 0;
        fichas.appendChild(el('button.ficha-opcion', {
          type: 'button',
          'aria-pressed': activa ? 'true' : 'false',
          disabled: !activa && lleno,
          onclick: function () {
            if (activa) elegidas.splice(pos, 1);
            else if (!lleno) elegidas.push(p.id);
            guardarBorrador();
            pintar();
          }
        }, [
          el('span', { texto: p.icono }),
          el('span', { texto: p.texto }),
          activa ? el('span.ficha-opcion__orden', { texto: String(pos + 1) }) : null
        ]));
      });

      var caja = el('div.grupo', null, [
        fichas,
        el('p.campo__ayuda', {
          texto: elegidas.length + ' de ' + I.PRIORITIES_MAX + ' elegidas' +
                 (lleno ? ' · para cambiar una, tóquela de nuevo para quitarla' : '')
        })
      ]);

      if (elegidas.indexOf('OTRO') >= 0) {
        caja.appendChild(el('div.campo', null, [
          el('label.campo__etiqueta', { for: 'prioridad-otro', texto: '¿Cuál otra cosa le gustaría mejorar?' }),
          el('input.campo__control', {
            id: 'prioridad-otro', type: 'text', valor: registro.prioridadOtro || '',
            oninput: function (ev) { registro.prioridadOtro = ev.target.value; guardarBorrador(); }
          })
        ]));
      }
      return caja;
    }

    function pantallaPago() {
      var opciones = el('div.opciones', { role: 'group', 'aria-label': 'Disposición de inversión' });
      I.PAYMENT_RANGES.forEach(function (r) {
        var elegida = registro.pago === r.codigo;
        opciones.appendChild(el('button.opcion', {
          type: 'button',
          'aria-pressed': elegida ? 'true' : 'false',
          onclick: function () { registro.pago = r.codigo; guardarBorrador(); pintar(); }
        }, [el('span.opcion__marca'), el('span', { texto: r.texto })]));
      });

      return el('div.pregunta', null, [
        el('span.pregunta__dimension', { texto: 'Inversión' }),
        el('p.pregunta__texto', {
          texto: 'Si COMEEN le ofreciera un paquete de servicios para mejorar la presencia digital de su negocio, ¿cuánto estaría dispuesto a invertir?'
        }),
        opciones
      ]);
    }

    /* ── Validación ───────────────────────────────────────────────────────── */
    function validar(pantalla) {
      errores = [];
      if (pantalla.tipo === 'datos') {
        I.CAMPOS_NEGOCIO.forEach(function (c) {
          if (c.requerido && !String(registro.negocio[c.id] || '').trim()) errores.push(c.id);
          if (c.otro && c.otro.requerido && registro.negocio[c.id] === c.otro.cuando &&
              !String(registro.negocio[c.otro.id] || '').trim()) errores.push(c.otro.id);
        });
      } else if (pantalla.tipo === 'madurez') {
        pantalla.items.forEach(function (q) {
          if (registro.madurez[q.id] === undefined) errores.push(q.id);
        });
      } else if (pantalla.tipo === 'canales') {
        I.CHANNELS.forEach(function (c) {
          if (registro.canales[c.id] === undefined) errores.push(c.id);
        });
      } else if (pantalla.tipo === 'brechas') {
        pantalla.items.forEach(function (g) {
          if (!registro.brechas[g.id]) errores.push(g.id);
        });
      } else if (pantalla.tipo === 'pago') {
        if (!registro.pago) errores.push('pago');
      }
      return errores.length === 0;
    }

    function textoAviso(pantalla) {
      if (!errores.length) return null;
      if (pantalla.tipo === 'datos') return 'Faltan datos marcados con *.';
      if (pantalla.tipo === 'canales') return 'Marque el estado de cada canal, aunque sea "No tiene".';
      if (pantalla.tipo === 'pago') return 'Elija una opción para continuar.';
      return errores.length === 1 ? 'Falta responder una pregunta.' : 'Faltan ' + errores.length + ' preguntas por responder.';
    }

    /* ── Render ───────────────────────────────────────────────────────────── */
    function pintar() {
      var pantalla = pantallas[indice];
      U.vaciar(contenedor);

      var esUltima = indice === pantallas.length - 1;
      var cuerpo;
      switch (pantalla.tipo) {
        case 'intro':        cuerpo = pantallaIntro(); break;
        case 'datos':        cuerpo = pantallaDatos(); break;
        case 'madurez':      cuerpo = pantallaMadurez(pantalla); break;
        case 'canales':      cuerpo = pantallaCanales(); break;
        case 'brechas':      cuerpo = pantallaBrechas(pantalla); break;
        case 'prioridades':  cuerpo = pantallaPrioridades(); break;
        case 'pago':         cuerpo = pantallaPago(); break;
        default:             cuerpo = el('div');
      }

      var desde = preguntasAntesDe(indice);
      var hasta = desde + (pantalla.preguntas || 0);

      if (pantalla.tipo !== 'intro') {
        contenedor.appendChild(el('div.progreso', null, [
          el('div.progreso__cabecera', null, [
            el('span.progreso__etapa', { texto: pantalla.bloque }),
            el('span.progreso__conteo', {
              texto: pantalla.preguntas
                ? (pantalla.preguntas === 1
                    ? 'Pregunta ' + hasta + ' de ' + totalPreguntas
                    : 'Preguntas ' + (desde + 1) + '–' + hasta + ' de ' + totalPreguntas)
                : 'Paso ' + (indice + 1) + ' de ' + pantallas.length
            })
          ]),
          el('div.progreso__riel', {
            role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(totalPreguntas),
            'aria-valuenow': String(hasta)
          }, [
            el('div.progreso__avance', { style: 'width:' + Math.round((hasta / totalPreguntas) * 100) + '%' })
          ])
        ]));
      }

      if (pantalla.titulo) contenedor.appendChild(el('h1.paso__titulo', { texto: pantalla.titulo }));
      if (pantalla.intro)  contenedor.appendChild(el('p.paso__intro', { texto: pantalla.intro }));

      var aviso = textoAviso(pantalla);
      if (aviso) contenedor.appendChild(el('p.aviso-validacion', { role: 'alert', texto: aviso }));

      contenedor.appendChild(cuerpo);

      contenedor.appendChild(el('div.pie-nav', null, [
        /* En la encuesta pública no hay "Salir": no existe un panel al que
           volver, y ofrecerlo solo confundiría al comerciante. */
        indice > 0 ? el('button.btn.btn--secundario', {
          type: 'button',
          onclick: function () { errores = []; indice--; guardarBorrador(); pintar(); global.scrollTo(0, 0); }
        }, 'Atrás') : (opciones.permiteSalir ? el('button.btn.btn--fantasma', {
          type: 'button', onclick: function () { opciones.alSalir && opciones.alSalir(); }
        }, 'Salir') : null),
        el('button.btn.btn--principal', {
          type: 'button',
          onclick: function () {
            if (!validar(pantalla)) { pintar(); return; }
            if (esUltima) { opciones.alTerminar(registro); return; }
            indice++;
            guardarBorrador();
            pintar();
            global.scrollTo(0, 0);
          }
        }, pantalla.tipo === 'intro' ? 'Empezar' : (esUltima ? 'Ver el resultado' : 'Continuar'))
      ]));
    }

    pintar();
    return { pintar: pintar };
  }

  global.COMEEN.ui.asistente = { crear: crear, construirPantallas: construirPantallas };
})(typeof globalThis !== 'undefined' ? globalThis : this);


/* ===== src/ui/resultado.js ===== */
/* ============================================================================
   ui/resultado.js — Ficha de diagnóstico
   ----------------------------------------------------------------------------
   El resultado NUNCA es solo "Nivel 2". Es: dónde está, qué ya tiene, qué le
   falta y qué haría COMEEN, en ese orden.

   Se muestran primero cuatro servicios como ruta de trabajo; el resto queda
   plegado. Un listado de once servicios no orienta a nadie.
   ========================================================================== */
(function (global) {
  'use strict';

  var U = global.COMEEN.ui.util;
  var el = U.el;
  var SERVICIOS_EN_RUTA = 4;

  function cabecera(registro, d) {
    var cortes = global.COMEEN.niveles.LEVEL_RULES;
    return el('div.resultado__cabecera', null, [
      el('p.resultado__eyebrow', { texto: 'Presencia digital COMEEN' }),
      el('h1.resultado__negocio', { texto: registro.negocio.nombre || 'Negocio sin nombre' }),
      el('span.resultado__nivel', null, [
        el('span.insignia__punto', { style: 'background:var(--nivel-' + d.nivel.id + ')' }),
        d.nivel.etiqueta
      ]),
      el('p.resultado__mensaje', { texto: d.nivel.mensaje }),
      el('div.medidor', null, [
        el('div.medidor__cifra', null, [String(d.puntaje), el('span', { texto: ' / ' + d.maximo + ' puntos' })]),
        el('div.medidor__riel', null, [
          el('div.medidor__avance', { style: 'width:' + Math.max(2, d.porcentaje) + '%' })
        ]),
        el('div.medidor__cortes', null, cortes.map(function (n) {
          return el('span', { texto: n.min + '–' + n.max + ' ' + n.nombre });
        }))
      ])
    ]);
  }

  function notaCoherencia(d) {
    if (!d.nivel.descendido) return null;
    var faltantes = d.nivel.descensos[0].faltantes;
    return el('div.nota-coherencia', null, [
      el('strong', { texto: 'Por puntaje daba ' + d.nivel.nivelPorPuntaje + '. ' }),
      'Todavía no llega ahí porque falta lo esencial: ' + faltantes.join(', ').toLowerCase() + '.'
    ]);
  }

  function listaFortalezas(d) {
    if (!d.fortalezas.length) {
      return el('p.campo__ayuda', { texto: 'Aún no hay elementos consolidados. Todo está por construir, y eso también es un buen punto de partida.' });
    }
    return el('ul.lista-marcas', null, d.fortalezas.map(function (f) {
      return el('li', null, [el('span.marca-si', { texto: '✓' }), f.texto]);
    }));
  }

  function listaOportunidades(d) {
    if (!d.oportunidades.length) {
      return el('p.campo__ayuda', { texto: 'No se detectaron vacíos en las doce variables. Un caso poco frecuente: vale la pena revisar las respuestas.' });
    }
    return el('ul.lista-marcas', null, d.oportunidades.map(function (o) {
      return el('li', null, [
        el('span.' + (o.severidad === 'alta' ? 'marca-falta' : 'marca-parcial'), { texto: o.severidad === 'alta' ? '!' : '~' }),
        o.texto
      ]);
    }));
  }

  function pasoServicio(s, numero) {
    var etiqueta = null;
    if (s.origen === 'ambas') etiqueta = el('span.etiqueta-origen.etiqueta-origen--ambas', { texto: 'lo pidió y le falta' });
    else if (s.origen === 'percibida') etiqueta = el('span.etiqueta-origen.etiqueta-origen--pedida', { texto: 'lo pidió' });
    else etiqueta = el('span.etiqueta-origen', { texto: 'detectado' });

    return el('li.ruta__paso', null, [
      el('span.ruta__orden', { texto: String(numero) }),
      el('div', null, [
        el('div.ruta__nombre', null, [s.icono + ' ' + s.nombre, etiqueta]),
        el('p.ruta__desc', { texto: s.descripcion })
      ])
    ]);

  function bloqueServicios(d) {
    if (!d.servicios.length) {
      return el('div.tarjeta', null, [
        el('p.tarjeta__titulo', { texto: 'Qué recomienda COMEEN' }),
        el('p', { texto: 'No se detectaron brechas ni el negocio pidió nada. Conviene revisarlo en campo antes de darlo por cerrado.' })
      ]);
    }

    var ruta = d.servicios.slice(0, SERVICIOS_EN_RUTA);
    var resto = d.servicios.slice(SERVICIOS_EN_RUTA);

    var tarjeta = el('div.tarjeta', null, [
      el('p.tarjeta__titulo', { texto: 'Qué recomienda COMEEN, en este orden' }),
      el('ol.ruta', null, ruta.map(function (s, i) { return pasoServicio(s, i + 1); }))
    ]);

    if (resto.length) {

        el('ol.ruta', { style: 'margin-top:var(--e-2)' },
          resto.map(function (s, i) { return pasoServicio(s, i + 1 + SERVICIOS_EN_RUTA); }))
      ]));
    }
    return tarjeta;
  }

  function bloqueCanales(d) {
    return el('div.tarjeta', null, [
      el('p.tarjeta__titulo', { texto: 'Sus canales hoy' }),
      el('div.canales-fila', null, d.canales.map(function (c) {
        return el('div.canal-pastilla.canal-pastilla--' + c.tono, null, [
          el('span.canal-pastilla__nombre', { texto: c.nombre }),
          el('span.canal-pastilla__estado', { texto: c.texto })
        ]);
      }))
    ]);
  }

  function bloquePrioridadesYPago(registro, d) {
    return el('div.dos-columnas', null, [
      el('div.tarjeta', null, [
        el('p.tarjeta__titulo', { texto: 'Lo que él quiere primero' }),
        d.prioridades.length
          ? el('ol.ruta', null, d.prioridades.map(function (p) {
              return el('li.ruta__paso', null, [
                el('span.ruta__orden', { texto: String(p.posicion) }),
                el('div.ruta__nombre', null, p.icono + ' ' + p.texto)
              ]);
